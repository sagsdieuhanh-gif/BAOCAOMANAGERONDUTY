name: Publish BAOCAOMANAGERONDUTY
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: manager-onduty-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          for f in ./*.js; do node --check "$f"; done
          node tests/manager-root.test.cjs
          node tests/v29-office-export.test.cjs
          node tests/v212-personnel-human-report.test.cjs
          node tests/v213-shuttle-reasons.test.cjs
          node tests/v216-shuttle-export.test.cjs
          node tests/v217-second-forecast.test.cjs
      - name: Stage Manager On Duty
        run: |
          mkdir -p _site/assets
          cp index.html ./*.js ./*.css _site/
          cp assets/logo-sags.png _site/assets/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4