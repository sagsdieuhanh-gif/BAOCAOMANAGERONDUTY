<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f8fc">
<meta name="description" content="SAGS Form Lite — hồ sơ chuyến bay, 6 biểu mẫu, Sổ tay và A/C Limits">
<title>SAGS Form Lite | Flight workspace</title>
<link rel="stylesheet" href="./style.css">
<link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 32 32" width="27" height="27" fill="none"><path d="M4 20.1 28 5l-9.3 23-4.5-10.3L4 20.1Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="m14.2 17.7 6.6-6.1" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span>
    <span class="brand-copy"><b>SAGS<span class="brand-dot">.</span>FORM</b><small>FLIGHT OPERATIONS <span class="v-sep">·</span> <span id="version">V1.3</span></small></span>
  </div>
  <div class="head-right"><span id="mode" class="pill">Đăng nhập</span><span id="identity" class="identity"></span><button id="logout" class="btn subtle hidden" type="button">Đăng xuất</button></div>
</header>
<nav id="nav" class="bottomnav hidden" aria-label="Điều hướng chính">
  <div class="nav-section-caption">WORKSPACE</div>
  <button data-nav="flights" type="button"><span class="nav-symbol" aria-hidden="true">✈</span><span>Chuyến bay</span></button>
  <button data-nav="notebook" type="button"><span class="nav-symbol" aria-hidden="true">▤</span><span>Sổ tay</span></button>
  <button data-nav="limits" type="button"><span class="nav-symbol" aria-hidden="true">◇</span><span>A/C Limits</span></button>
  <button data-nav="users" class="admin-only" type="button"><span class="nav-symbol" aria-hidden="true">♙</span><span>Tài khoản</span></button>
  <div class="sidebar-foot"><span class="sidebar-live-dot"></span><span>Workspace Lite<br><small>6 biểu mẫu · một hồ sơ</small></span></div>
</nav>
<main id="app"><div class="hero"><span class="eyebrow">SAGS · CAM RANH</span><h1>Không gian điều hành chuyến bay</h1><p>Đang khởi tạo hệ thống…</p></div></main>
<div id="dialog" class="dialog hidden" role="dialog" aria-modal="true"><div id="dialogCard" class="dialog-card"></div></div>
<div id="alertArea" class="alertArea" aria-live="assertive"></div>
<div id="toast" role="status"></div>
<script src="./config.js"></script>
<script type="module" src="./src/app.mjs"></script>
</body>
</html>
